# Netlify deployment configuration for the VeriPeers site (TanStack Start + Nitro).
# The app uses SSR and server functions, so the build emits Netlify Functions
# (.netlify/functions-internal, auto-detected) plus static assets in dist/.

[build]
  command = "bun run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public (non-secret) backend values. The admin server functions read the
  # non-VITE names at request time; the VITE_* names are inlined at build time.
  SUPABASE_URL = "https://rlcovuzlnudllqekhdco.supabase.co"
  SUPABASE_PUBLISHABLE_KEY = "sb_publishable_-b6ut49VQ5PJMwPD-2WYOA_UnglBJkQ"
  SUPABASE_PROJECT_ID = "rlcovuzlnudllqekhdco"
  VITE_SUPABASE_URL = "https://rlcovuzlnudllqekhdco.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_-b6ut49VQ5PJMwPD-2WYOA_UnglBJkQ"
  VITE_SUPABASE_PROJECT_ID = "rlcovuzlnudllqekhdco"

# Routing: send every non-asset request to the SSR function generated by the
# build (static files in dist/ still take precedence because force = false).
# build:netlify copies CDN pointer assets into dist/__l5e/assets-v1/, so logo,
# photo, and future GIF files are served locally before this SSR fallback.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = false

# The public backend values above are declared here so both the build and the
# Netlify Functions runtime (admin login + submissions) can reach the database.
# No secret keys are required for this site.
