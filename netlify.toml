# Netlify deployment configuration for the VeriPeers site (TanStack Start + Nitro).
# The app uses SSR and server functions, so the build must emit Netlify's
# serverless format (NITRO_PRESET=netlify) instead of static files only.

[build]
  command = "bun run build"
  publish = ".output/public"

[build.environment]
  NITRO_PRESET = "netlify"
  NODE_VERSION = "22"

# All non-asset requests are served by the SSR function generated by the build.
# The Netlify preset writes its own function routing; no manual redirects needed.
