# Netlify deployment configuration for the VeriPeers site (TanStack Start + Nitro).
# The app uses SSR and server functions, so the build emits Netlify Functions
# (.netlify/functions-internal, auto-detected) plus static assets in dist/.

[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Routing: dist/_redirects (generated by the build) sends all non-asset
# requests to the SSR function — no manual redirect rules needed.

# Required environment variables to add in Netlify Site settings → Environment:
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, VITE_SUPABASE_PROJECT_ID
# (same values as the project's .env — the site needs them at build time).
